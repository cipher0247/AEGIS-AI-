name: Feature Request
description: Suggest an idea or enhancement for AEGIS-AI
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping shape the future of AEGIS-AI!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a problem or specific cybersecurity workflow?
      placeholder: "e.g., I'm always frustrated when exporting findings to DefectDojo..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you would like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've evaluated.
